<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livraria V9 | Jessica Code</title>
    <meta name="description" content="Uma livraria premium com sincronização em tempo real via Firebase.">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./styles/globals.css">
    <link rel="stylesheet" href="./styles/responsive.css">

    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
      }
    }
    </script>
</head>
<body>

    <div class="glow-effect"></div>

    <div id="app">
        <header class="app-header">
            <div class="header-content">
                <h1 id="header-title" class="header-title">Livraria V9</h1>
            </div>
        </header>

        <!-- NOVA SEÇÃO HERO -->
        <section class="hero-section">
            <div class="hero-content">
                <h2 class="hero-title">Onde cada capa conta uma história.</h2>
                <p class="hero-subtitle">Descubra obras selecionadas que transcendem o tempo. Uma curadoria de clássicos e contemporâneos para o leitor exigente.</p>
            </div>
        </section>

        <main>
            <section id="featured-book-container" class="featured-book-section"></section>
            
            <section id="suggested-books-section" class="suggested-books-section">
                <h2 class="section-title">Nossa Seleção</h2>
                <div id="suggested-books-grid" class="book-grid"></div>
            </section>
        </main>

        <!-- NOVO RODAPÉ -->
        <footer class="app-footer">
            <div class="footer-content">
                <p>&copy; 2024 Livraria V9. Todos os direitos reservados.</p>
                <p>Uma criação de <span class="jessica-code">Jessica Code</span></p>
            </div>
        </footer>
    </div>

    <div id="admin-panel-container"></div>
    <div id="book-modal-container"></div>

    <div id="loader" class="loader-overlay">
        <div class="loader-spinner"></div>
    </div>

    <script type="module" src="app.js"></script>

</body>
</html>
