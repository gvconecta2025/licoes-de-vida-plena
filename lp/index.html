<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jessica Code Editora</title>
    <style>
        /* Reset e estilos base */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0f0a 0%, #2c1810 30%, #3d2317 60%, #4a2c1e 100%);
            color: #f5e6d3;
            min-height: 100vh;
            line-height: 1.6;
            position: relative;
        }
        body.no-scroll { overflow: hidden; }

        /* Fios dourados decorativos */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(212, 175, 55, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 20%, rgba(212, 175, 55, 0.04) 0%, transparent 40%);
            pointer-events: none; z-index: -1;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }

        /* Header */
        header {
            padding: 20px 0; text-align: center; border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            background: rgba(26, 15, 10, 0.8); backdrop-filter: blur(10px); position: relative; z-index: 10;
        }
        header h1 {
            font-size: 1.5rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
            color: #d4af37; text-shadow: 0 0 20px rgba(212, 175, 55, 0.3); cursor: pointer;
        }

        /* Seção principal do livro - Desktop */
        .hero { display: flex; align-items: center; justify-content: center; gap: 60px; padding: 80px 0; flex-wrap: wrap; }
        .book-cover {
            flex: 0 0 300px; height: 450px; background: linear-gradient(145deg, #1a0f0a, #3d2317);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; text-align: center; padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(212, 175, 55, 0.1), inset 0 0 30px rgba(212, 175, 55, 0.05);
            position: relative; overflow: hidden; border: 1px solid rgba(212, 175, 55, 0.2);
            background-size: contain; background-position: center; background-repeat: no-repeat;
        }
        .book-cover-content { position: relative; z-index: 1; color: #f5e6d3; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); background: rgba(0,0,0,0.4); padding: 15px; border-radius: 8px; backdrop-filter: blur(4px); }
        .book-cover h2 { font-size: 2rem; margin-bottom: 10px; text-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
        .book-cover p { font-size: 0.9rem; opacity: 0.9; }
        .book-info { flex: 1; min-width: 300px; }
        .book-info h2 { font-size: 2.5rem; margin-bottom: 15px; color: #d4af37; text-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
        .book-info .subtitle { font-size: 1.2rem; color: #c4a882; margin-bottom: 10px; font-style: italic; }
        .book-info .author { font-size: 1.1rem; color: #c4a882; margin-bottom: 20px; }
        .book-info .price { font-size: 2rem; font-weight: 700; color: #d4af37; margin-bottom: 25px; text-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
        .book-info .price span { font-size: 1rem; color: #8b7355; text-decoration: line-through; margin-left: 10px; font-weight: 400; }
        .btn { display: inline-block; padding: 16px 40px; background: linear-gradient(90deg, #d4af37, #f0d68a); color: #1a0f0a; text-decoration: none; border-radius: 50px; font-weight: 600; font-size: 1.1rem; transition: all 0.3s ease; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4), 0 0 30px rgba(212, 175, 55, 0.1); }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6), 0 0 40px rgba(212, 175, 55, 0.2); }
        .btn-secondary { background: transparent; border: 2px solid #d4af37; color: #d4af37; margin-left: 15px; box-shadow: none; }
        .btn-secondary:hover { background: rgba(212, 175, 55, 0.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }

        /* Mobile Hero - Tela Cheia */
        .mobile-hero {
            display: none;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }
        .mobile-hero .mobile-cover {
            width: 200px;
            height: 280px;
            margin-bottom: 30px;
            border-radius: 12px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .mobile-hero h2 { font-size: 2rem; color: #d4af37; margin-bottom: 10px; text-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
        .mobile-hero .mobile-subtitle { font-size: 1rem; color: #c4a882; margin-bottom: 10px; font-style: italic; }
        .mobile-hero .mobile-author { font-size: 1rem; color: #c4a882; margin-bottom: 15px; }
        .mobile-hero .mobile-price { font-size: 1.8rem; font-weight: 700; color: #d4af37; margin-bottom: 25px; text-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
        .mobile-hero .mobile-price span { font-size: 0.9rem; color: #8b7355; text-decoration: line-through; margin-left: 10px; font-weight: 400; }
        .mobile-hero .mobile-buttons { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-bottom: 40px; }
        .mobile-hero .mobile-buttons .btn { padding: 14px 30px; font-size: 1rem; }
        .mobile-hero .scroll-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            color: #d4af37;
            font-size: 2rem;
            cursor: pointer;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-20px); }
            60% { transform: translateX(-50%) translateY(-10px); }
        }
    </style>
</head>

            <form class="admin-form" id="adminForm" style="display: none;">
                <input type="hidden" id="bookId">
                <h3 id="formTitle" class="full-width" style="color: #f0d68a; margin-bottom: 10px;"></h3>
                
                <div class="form-group">
                    <label for="bookTitle">Título</label>
                    <input type="text" id="bookTitle" required>

                <div class="form-group">

                </div>
                <div class="form-group">

                    <input type="text" id="bookPrice" required>

                    <label for="bookOldPrice">Preço Original (ex: R$ 89,90)</label>
                    <input type="text" id="bookOldPrice" required>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelFormBtn">Cancelar</button>

        </div>
    </div>

        <div class="container">
            <p>© 2024 <span id="footerTitle">Jessica Code Editora</span> - Todos os direitos reservados</p>

                price: 'R$ 69,90',
                oldPrice: 'R$ 99,90',
                synopsis: 'Vá além do básico do React e aprenda padrões avançados, otimização de performance e arquitetura de componentes.',
                image: 'https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=400'
            },
            {
                id: 5,
                title: 'Python para Todos',
                subtitle: 'Aprenda programação de forma divertida',
                author: 'Lucas Mendes',
                price: 'R$ 44,90',
                oldPrice: 'R$ 74,90',
                synopsis: 'Aprenda Python do zero de forma prática e divertida. Cobre desde conceitos básicos até web scraping e análise de dados.',
                image: 'https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=400'
            }
        ];

        // --- ELEMENTOS DO DOM ---
        const mainContent = document.getElementById('mainContent');
        const mainTitle = document.getElementById('mainTitle');
        const footerTitle = document.getElementById('footerTitle');
        const adminPanelOverlay = document.getElementById('adminPanelOverlay');
        const adminPanel = document.getElementById('adminPanel');
        const adminPanelClose = document.getElementById('adminPanelClose');
        const adminBookList = document.getElementById('adminBookList');
        const addNewBookBtn = document.getElementById('addNewBookBtn');
        const adminForm = document.getElementById('adminForm');
        const cancelFormBtn = document.getElementById('cancelFormBtn');
        const formTitle = document.getElementById('formTitle');
        const lpTitleInput = document.getElementById('lpTitle');
        const saveLpTitleBtn = document.getElementById('saveLpTitle');
        const bookDetailOverlay = document.getElementById('bookDetailOverlay');
        const bookDetailPanel = document.getElementById('bookDetailPanel');
        const bookDetailContent = document.getElementById('bookDetailContent');
        const bookDetailClose = document.getElementById('bookDetailClose');

        // --- FUNÇÃO PARA GERAR HTML DO LIVRO PRINCIPAL ---
        function generateMainBookHTML(book) {
            const coverStyle = book.image ? `background-image: url('${book.image}')` : 'background: linear-gradient(145deg, #1a0f0a, #3d2317);';
            const coverContent = !book.image ? `<div class="book-cover-content">
                <h2>${book.title.replace(' ', '<br>')}</h2>
                <p>${book.author}</p>
            </div>` : '';

            return {
                coverStyle,
                coverContent,
                title: book.title,
                subtitle: book.subtitle,
                author: book.author,
                price: book.price,
                oldPrice: book.oldPrice
            };
        }

        // --- FUNÇÕES DE RENDERIZAÇÃO ---
        function renderLandingPage() {
            mainTitle.textContent = lpTitle;
            footerTitle.textContent = lpTitle.replace('☕ ', '');

            if (books.length === 0) {
                mainContent.innerHTML = `
                    <div class="mobile-hero" style="display: flex;">
                        <h2>Nenhum livro cadastrado</h2>
                        <p style="color: #c4a882; margin-top: 20px;">Clique 5 vezes no título para abrir o painel admin</p>
                    </div>
                `;
                return;
            }

            const mainBook = books[0];
            const bookData = generateMainBookHTML(mainBook);
            const otherBooks = books.slice(1);

            // Versão Desktop
            const heroDesktop = `
                <section class="hero container">
                    <div class="book-cover" style="${bookData.coverStyle}">
                        ${bookData.coverContent}
                    </div>
                    <div class="book-info">
                        <h2>${bookData.title}</h2>
                        ${bookData.subtitle ? `<p class="subtitle">${bookData.subtitle}</p>` : ''}
                        <p class="author">Por ${bookData.author}</p>
                        <p class="price">
                            ${bookData.price} <span>${bookData.oldPrice}</span>
                        </p>
                        <a href="#" class="btn">📖 Comprar Agora</a>
                        <a href="#" class="btn btn-secondary">📄 Ler Amostra</a>
                    </div>
                </section>
            `;

            // Versão Mobile - MESMOS DADOS
            const heroMobile = `
                <section class="mobile-hero">
                    <div class="mobile-cover" style="${bookData.coverStyle}">
                        ${bookData.coverContent}
                    </div>
                    <h2>${bookData.title}</h2>
                    ${bookData.subtitle ? `<p class="mobile-subtitle">${bookData.subtitle}</p>` : ''}
                    <p class="mobile-author">Por ${bookData.author}</p>
                    <p class="mobile-price">
                        ${bookData.price} <span>${bookData.oldPrice}</span>
                    </p>
                    <div class="mobile-buttons">
                        <a href="#" class="btn">📖 Comprar</a>
                        <a href="#" class="btn btn-secondary">📄 Amostra</a>
                    </div>
                    <div class="scroll-indicator">↓</div>
                </section>
            `;

            const synopsisHTML = `
                <section class="synopsis-bar">
                    <div class="container">
                        <div class="synopsis-icon">📖</div>
                        <div class="synopsis-text">
                            <h3>Sinopse</h3>
                            <p>${mainBook.synopsis.replace(/\n/g, '<br>')}</p>
                        </div>
                    </div>
                </section>
            `;

            const otherBooksHTML = otherBooks.length > 0 ? `
                <section class="other-books">
                    <div class="container">
                        <h2>📕 Outros Títulos que Você Pode Gostar</h2>
                        <div class="books-grid">
                            ${otherBooks.map(book => `
                                <div class="book-card" data-id="${book.id}">
                                    <div class="mini-cover" style="${book.image ? `background-image: url('${book.image}')` : 'background: linear-gradient(135deg, #4a2c1e, #2c1810);'}">
                                        ${!book.image ? `<div class="mini-cover-content"><span>${book.title}</span></div>` : ''}
                                    </div>
                                    <h3>${book.title}</h3>
                                    <p class="card-author">${book.author}</p>
                                    <p class="card-price">${book.price} <span>${book.oldPrice}</span></p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>
            ` : '';

            mainContent.innerHTML = heroDesktop + heroMobile + synopsisHTML + otherBooksHTML;

            // Adiciona eventos aos cards de outros livros
            document.querySelectorAll('.book-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    const bookId = parseInt(this.dataset.id);
                    openBookDetail(bookId);
                });
            });
        }

        function renderAdminPanel() {
            adminBookList.innerHTML = books.map((book, index) => `
                <div class="book-item">
                    <img src="${book.image || 'https://via.placeholder.com/40x60/2c1810/d4af37?text=Capa'}" alt="Capa de ${book.title}">
                    <div class="info">
                        <strong>${book.title}</strong> ${index === 0 ? '<span style="color: #d4af37;">(Principal)</span>' : ''}<br>
                        <span>${book.author}</span>
                        ${book.subtitle ? `<br><span style="font-size: 0.85em; color: #8b7355;">${book.subtitle}</span>` : ''}
                    </div>
                    <div class="actions">
                        <button class="btn-admin btn-edit" data-id="${book.id}">Editar</button>
                        <button class="btn-admin btn-delete" data-id="${book.id}">Excluir</button>
                    </div>
                </div>
            `).join('');
        }

        // --- FUNÇÕES DE DADOS (LocalStorage) ---
        function saveData() {
            const data = { books: books, lpTitle: lpTitle };
            localStorage.setItem('jessicaCodeData', JSON.stringify(data));
        }

        function loadData() {
            const storedData = localStorage.getItem('jessicaCodeData');
            if (storedData) {
                const data = JSON.parse(storedData);
                books = data.books || [];
                lpTitle = data.lpTitle || '☕ Jessica Code Editora';
            } else {
                books = initialBooks;
                lpTitle = '☕ Jessica Code Editora';
                saveData();
            }
        }

        // --- FUNÇÕES DO PAINEL DE DETALHES ---
        function openBookDetail(bookId) {
            const book = books.find(b => b.id === bookId);
            if (!book) return;

            const coverStyle = book.image ? `background-image: url('${book.image}')` : 'background: linear-gradient(135deg, #1a0f0a, #3d2317);';
            const coverContent = !book.image ? `<span>${book.title}</span>` : '';

            bookDetailContent.innerHTML = `
                <div class="panel-header">
                    <div class="panel-cover" style="${coverStyle}">
                        ${coverContent}
                    </div>
                    <div class="panel-info">
                        <h2>${book.title}</h2>
                        ${book.subtitle ? `<p class="panel-subtitle">${book.subtitle}</p>` : ''}
                        <p class="panel-author">Por ${book.author}</p>
                        <p class="panel-synopsis">${book.synopsis.replace(/\n/g, '<br>')}</p>
                        <p class="panel-price">
                            ${book.price} <span>${book.oldPrice}</span>
                        </p>
                        <div class="panel-buttons">
                            <a href="#" class="btn">📖 Comprar Agora</a>
                            <a href="#" class="btn btn-secondary">📄 Ler Amostra</a>
                        </div>
                    </div>
                </div>
            `;

            bookDetailOverlay.classList.add('active');
            bookDetailPanel.classList.add('active');
            document.body.classList.add('no-scroll');
        }

        function closeBookDetail() {
            bookDetailOverlay.classList.remove('active');
            bookDetailPanel.classList.remove('active');
            document.body.classList.remove('no-scroll');
        }

        bookDetailClose.addEventListener('click', closeBookDetail);
        bookDetailOverlay.addEventListener('click', closeBookDetail);

        // --- LÓGICA DO PAINEL ADMIN ---
        let clickCount = 0;
        let clickTimer = null;

        mainTitle.addEventListener('click', () => {
            clickCount++;
            if (clickTimer) clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clickCount = 0; }, 1500);
            if (clickCount === 5) {
                clickCount = 0;
                openAdminPanel();
            }
        });

        function openAdminPanel() {
            lpTitleInput.value = lpTitle;
            renderAdminPanel();
            adminPanelOverlay.classList.add('active');
            adminPanel.classList.add('active');
            document.body.classList.add('no-scroll');
        }

        function closeAdminPanel() {
            adminPanelOverlay.classList.remove('active');
            adminPanel.classList.remove('active');
            document.body.classList.remove('no-scroll');
            hideForm();
        }

        adminPanelClose.addEventListener('click', closeAdminPanel);
        adminPanelOverlay.addEventListener('click', closeAdminPanel);

        // --- SALVAR TÍTULO DA LP ---
        saveLpTitleBtn.addEventListener('click', () => {
            const newTitle = lpTitleInput.value.trim();
            if (newTitle) {
                lpTitle = newTitle;
                saveData();
                renderLandingPage();
                alert('Título atualizado com sucesso!');
            }
        });

        // --- LÓGICA DO FORMULÁRIO ---
        function showForm(type = 'new', book = null) {
            adminForm.style.display = 'grid';
            addNewBookBtn.style.display = 'none';
            adminForm.reset();
            document.getElementById('bookId').value = '';

            if (type === 'edit' && book) {
                formTitle.textContent = 'Editando Livro';
                document.getElementById('bookId').value = book.id;
                document.getElementById('bookTitle').value = book.title;
                document.getElementById('bookSubtitle').value = book.subtitle || '';
                document.getElementById('bookAuthor').value = book.author;
                document.getElementById('bookPrice').value = book.price;
                document.getElementById('bookOldPrice').value = book.oldPrice;
                document.getElementById('bookImage').value = book.image || '';
                document.getElementById('bookSynopsis').value = book.synopsis;
            } else {
                formTitle.textContent = 'Adicionar Novo Livro';
            }
        }

        function hideForm() {
            adminForm.style.display = 'none';
            addNewBookBtn.style.display = 'block';
        }

        addNewBookBtn.addEventListener('click', () => showForm('new'));
        cancelFormBtn.addEventListener('click', hideForm);

        adminForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('bookId').value;
            const bookData = {
                title: document.getElementById('bookTitle').value,
                subtitle: document.getElementById('bookSubtitle').value,
                author: document.getElementById('bookAuthor').value,
                price: document.getElementById('bookPrice').value,
                oldPrice: document.getElementById('bookOldPrice').value,
                image: document.getElementById('bookImage').value,
                synopsis: document.getElementById('bookSynopsis').value,
            };

            if (id) {
                const index = books.findIndex(b => b.id == id);
                if (index > -1) {
                    books[index] = { ...books[index], ...bookData };
                }
            } else {
                bookData.id = Date.now();
                books.push(bookData);
            }

            saveData();
            renderLandingPage();
            renderAdminPanel();
            hideForm();
        });

        // --- AÇÕES DE EDITAR/EXCLUIR ---
        adminBookList.addEventListener('click', (e) => {
            const target = e.target;
            const bookId = target.dataset.id;

            if (target.classList.contains('btn-edit')) {
                const bookToEdit = books.find(b => b.id == bookId);
                if (bookToEdit) showForm('edit', bookToEdit);
            }

            if (target.classList.contains('btn-delete')) {
                if (confirm('Tem certeza que deseja excluir este livro?')) {
                    books = books.filter(b => b.id != bookId);
                    saveData();
                    renderLandingPage();
                    renderAdminPanel();
                }
            }
        });

        // --- FECHAR COM TECLA ESC ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (bookDetailPanel.classList.contains('active')) {
                    closeBookDetail();
                }
                if (adminPanel.classList.contains('active')) {
                    closeAdminPanel();
                }
            }
        });

        // --- INICIALIZAÇÃO ---
        function init() {
            loadData();
            renderLandingPage();
        }

        init();
    });
    </script>
</body>
</html>
