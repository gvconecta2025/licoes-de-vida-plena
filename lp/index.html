<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jessica Code Editora</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        /* ===== RESET E ESTILOS BASE (MOBILE-FIRST) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0f0a 0%, #2c1810 30%, #3d2317 60%, #4a2c1e 100%);
            color: #f5e6d3;
            min-height: 100vh;
            line-height: 1.6;
            position: relative;
        }
        body.no-scroll { overflow: hidden; }

        /* Fios dourados decorativos (fundo fixo) */
        body::before {
            content: ''; 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(212, 175, 55, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 20%, rgba(212, 175, 55, 0.04) 0%, transparent 40%);
            pointer-events: none; 
            z-index: -1;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }

        /* ===== HEADER ===== */
        header {
            padding: 15px 0; text-align: center; border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            background: rgba(26, 15, 10, 0.8); backdrop-filter: blur(10px); position: relative; z-index: 10;
        }
        header h1 {
            font-size: 1.2rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
            color: #d4af37; text-shadow: 0 0 20px rgba(212, 175, 55, 0.3); cursor: pointer;
        }

        /* ===== SEÇÃO HERO UNIFICADA (MOBILE-FIRST) ===== */
        .hero-section {
            min-height: 100vh; /* Tela cheia no mobile */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }

        .hero-section .book-cover {
            width: 200px;
            height: 280px;
            margin-bottom: 30px;
            border-radius: 12px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background-color: #1a0f0a; /* fallback caso não tenha imagem */
        }
        .book-cover-content {
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .hero-section h2 {
            font-size: 2rem;
            color: #d4af37;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }
        .hero-section .subtitle {
            font-size: 1rem;
            color: #c4a882;
            margin-bottom: 10px;
            font-style: italic;
        }
        .hero-section .author {
            font-size: 1rem;
            color: #c4a882;
            margin-bottom: 15px;
        }
        .hero-section .price {
            font-size: 1.8rem;
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }
        .hero-section .price span {
            font-size: 0.9rem;
            color: #8b7355;
            text-decoration: line-through;
            margin-left: 10px;
            font-weight: 400;
        }
        .hero-section .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 40px;
        }
        .hero-section .scroll-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            color: #d4af37;
            font-size: 2rem;
            cursor: pointer;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-20px); }
            60% { transform: translateX(-50%) translateY(-10px); }
        }

        /* ===== BOTÕES ===== */
        .btn {
            display: inline-block;
            padding: 14px 30px;
            background: linear-gradient(90deg, #d4af37, #f0d68a);
            color: #1a0f0a;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4), 0 0 30px rgba(212, 175, 55, 0.1);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6), 0 0 40px rgba(212, 175, 55, 0.2);
        }
        .btn-secondary {
            background: transparent;
            border: 2px solid #d4af37;
            color: #d4af37;
            margin-left: 0;
            box-shadow: none;
        }
        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.1);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        /* ===== SEÇÃO SINOPSE ===== */
        .synopsis-bar {
            background: rgba(26, 15, 10, 0.9);
            padding: 30px 0;
            border-top: 2px solid rgba(212, 175, 55, 0.3);
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), inset 0 0 30px rgba(212, 175, 55, 0.05);
        }
        .synopsis-bar .container {
            display: flex;
            flex-direction: column; /* Mobile: empilhado */
            align-items: center;
            gap: 20px;
            text-align: center;
        }
        .synopsis-bar .synopsis-icon {
            font-size: 2.5rem;
            color: #d4af37;
        }
        .synopsis-bar .synopsis-text h3 {
            font-size: 1.2rem;
            color: #d4af37;
            margin-bottom: 10px;
        }
        .synopsis-bar .synopsis-text p {
            font-size: 1rem;
            color: #e8d5c4;
            line-height: 1.7;
        }

        /* ===== OUTROS LIVROS ===== */
        .other-books {
            padding: 60px 0;
        }
        .other-books h2 {
            text-align: center;
            font-size: 1.6rem;
            margin-bottom: 40px;
            color: #d4af37;
        }
        .books-grid {
            display: grid;
            grid-template-columns: 1fr; /* Mobile: uma coluna */
            gap: 20px;
        }
        .book-card {
            background: rgba(26, 15, 10, 0.8);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .book-card:hover {
            transform: translateY(-5px);
            border-color: #d4af37;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }
        .book-card .mini-cover {
            width: 100%;
            height: 200px;
            margin-bottom: 15px;
            border-radius: 8px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            border: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f5e6d3;
            font-size: 0.9rem;
            background-color: #2c1810;
        }
        .book-card h3 { font-size: 1.2rem; margin-bottom: 5px; }
        .book-card .card-author { color: #c4a882; font-size: 0.9rem; margin-bottom: 10px; }
        .book-card .card-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 15px;
        }
        .book-card .card-price span {
            font-size: 0.9rem;
            color: #8b7355;
            text-decoration: line-through;
            margin-left: 5px;
        }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            padding: 30px 0;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            color: #c4a882;
            font-size: 0.9rem;
            background: rgba(26, 15, 10, 0.8);
            backdrop-filter: blur(10px);
        }
        footer a { color: #d4af37; text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1 id="mainTitle">☕ Jessica Code Editora</h1>
        </div>
    </header>

    <main id="mainContent">
        <!-- Conteúdo gerado dinamicamente -->
    </main>






    <!-- Painel de Detalhes do Livro -->
    <div class="book-detail-overlay" id="bookDetailOverlay"></div>
    <div class="book-detail-panel" id="bookDetailPanel">
        <button class="panel-close" id="bookDetailClose">✕</button>
        <div class="panel-content" id="bookDetailContent"></div>
    </div>

    <!-- Painel de Administração -->
    <div class="admin-panel-overlay" id="adminPanelOverlay"></div>
    <div class="admin-panel" id="adminPanel">
        <button class="panel-close" id="adminPanelClose">✕</button>
        <div class="panel-content">
            <h2>Gerenciador de Livros</h2>
            
            <div class="admin-form" id="lpTitleForm">
                <div class="form-group full-width">
                    <label for="lpTitle">Título da Landing Page (em negrito)</label>
                    <input type="text" id="lpTitle" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn" id="saveLpTitle">Salvar Título</button>
                </div>
            </div>

            <div class="admin-book-list" id="adminBookList"></div>
            
            <button class="btn" id="addNewBookBtn" style="margin-top: 20px; width: 100%;">+ Adicionar Novo Livro</button>

            <form class="admin-form" id="adminForm" style="display: none;">
                <input type="hidden" id="bookId">
                <h3 id="formTitle" class="full-width" style="color: #f0d68a;"></h3>
                
                <div class="form-group"><label for="bookTitle">Título</label><input type="text" id="bookTitle" required></div>
                <div class="form-group"><label for="bookSubtitle">Subtítulo</label><input type="text" id="bookSubtitle"></div>
                <div class="form-group"><label for="bookAuthor">Autor</label><input type="text" id="bookAuthor" required></div>
                <div class="form-group"><label for="bookPrice">Preço Promocional</label><input type="text" id="bookPrice" required></div>
                <div class="form-group"><label for="bookOldPrice">Preço Original</label><input type="text" id="bookOldPrice" required></div>
                <div class="form-group full-width"><label for="bookImage">URL da Imagem da Capa</label><input type="url" id="bookImage"></div>
                <div class="form-group full-width"><label for="bookSynopsis">Sinopse</label><textarea id="bookSynopsis" required></textarea></div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelFormBtn">Cancelar</button>
                    <button type="submit" class="btn">Salvar Livro</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2024 <span id="footerTitle">Jessica Code Editora</span> - Todos os direitos reservados</p>
            <p>Feito com ☕ para desenvolvedores | <a href="#">Termos de Uso</a> | <a href="#">Privacidade</a></p>
        </div>
    </footer>

    <style>
        /* ===== PAINÉIS (mantidos) ===== */
        .admin-panel-overlay, .book-detail-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: 1000;
        }
        .admin-panel-overlay.active, .book-detail-overlay.active {
            display: block; opacity: 1;
        }
        .admin-panel, .book-detail-panel {
            position: fixed; z-index: 1001; overflow-y: auto;
            background: linear-gradient(135deg, #1a0f0a, #2c1810);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .admin-panel {
            top: -85vh; left: 0; width: 100%; height: 85vh;
            border-radius: 0 0 30px 30px;
        }
        .admin-panel.active { top: 0; }
        .book-detail-panel {
            bottom: -85%; left: 0; width: 100%; height: 85%;
            border-radius: 30px 30px 0 0;
        }
        .book-detail-panel.active { bottom: 0; }

        .panel-close {
            position: absolute; top: 20px; right: 20px; width: 40px; height: 40px;
            background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.3);
            border-radius: 50%; font-size: 1.5rem; cursor: pointer; color: #d4af37;
            display: flex; align-items: center; justify-content: center;
        }
        .panel-content { padding: 40px; max-width: 800px; margin: 0 auto; }

        .admin-book-list .book-item {
            display: flex; align-items: center; gap: 15px; padding: 15px;
            background: rgba(255,255,255,0.03); border-radius: 8px; margin-bottom: 10px;
        }
        .admin-book-list .book-item img { width: 40px; height: 60px; border-radius: 4px; object-fit: contain; }
        .btn-admin { padding: 8px 12px; font-size: 0.9rem; border-radius: 5px; cursor: pointer; border: 1px solid; }
        .btn-edit { background-color: #d4af37; color: #1a0f0a; border-color: #d4af37; }
        .btn-delete { background-color: transparent; color: #ff6b6b; border-color: #ff6b6b; }

        .admin-form {
            background: rgba(0,0,0,0.2); padding: 25px; border-radius: 12px;
            display: grid; grid-template-columns: 1fr; gap: 15px;
            margin-top: 20px;
        }
        .admin-form label { color: #c4a882; margin-bottom: 5px; }
        .admin-form input, .admin-form textarea {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(212,175,55,0.3);
            border-radius: 5px; padding: 12px; color: #f5e6d3;
        }
        .admin-form .form-actions { display: flex; justify-content: flex-end; gap: 15px; }

        /* ===== MEDIA QUERIES PROGRESSIVAS (DESKTOP) ===== */
        @media (min-width: 769px) {
            /* Layout horizontal no hero */
            .hero-section {
                flex-direction: row;
                gap: 60px;
                padding: 80px 0;
                text-align: left;
                min-height: auto;
            }
            .hero-section .book-cover {
                width: 300px;
                height: 450px;
                margin-bottom: 0;
            }
            .hero-section h2 {
                font-size: 2.5rem;
            }
            .hero-section .hero-buttons {
                justify-content: flex-start;
            }
            .hero-section .scroll-indicator {
                display: none; /* Seta apenas no mobile */
            }

            /* Sinopse em linha */
            .synopsis-bar .container {
                flex-direction: row;
                text-align: left;
                gap: 40px;
            }

            /* Grid de livros com múltiplas colunas */
            .books-grid {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 30px;
            }

            header h1 { font-size: 1.5rem; }
        }
    </style>



    <script>
    // ============================================================
    // CONFIGURAÇÃO DO FIREBASE
    // ============================================================
    const firebaseConfig = {
        apiKey: "SUA_API_KEY",
        authDomain: "SEU_PROJETO.firebaseapp.com",
        projectId: "SEU_PROJETO",
        storageBucket: "SEU_PROJETO.appspot.com",
        messagingSenderId: "SEU_SENDER_ID",
        appId: "SEU_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const booksCollection = db.collection('books');

    // ============================================================
    // ESTADO CENTRALIZADO
    // ============================================================
    const state = {
        books: [],
        lpTitle: '☕ Jessica Code Editora'
    };

    // ============================================================
    // ELEMENTOS DO DOM (REFERÊNCIAS)
    // ============================================================
    const mainContent = document.getElementById('mainContent');
    const mainTitle = document.getElementById('mainTitle');
    const footerTitle = document.getElementById('footerTitle');
    const adminPanelOverlay = document.getElementById('adminPanelOverlay');
    const adminPanel = document.getElementById('adminPanel');
    const adminBookList = document.getElementById('adminBookList');
    const lpTitleInput = document.getElementById('lpTitle');
    const saveLpTitleBtn = document.getElementById('saveLpTitle');
    const bookDetailOverlay = document.getElementById('bookDetailOverlay');
    const bookDetailPanel = document.getElementById('bookDetailPanel');
    const bookDetailContent = document.getElementById('bookDetailContent');
    const bookDetailClose = document.getElementById('bookDetailClose');
    const adminForm = document.getElementById('adminForm');
    const cancelFormBtn = document.getElementById('cancelFormBtn');
    const addNewBookBtn = document.getElementById('addNewBookBtn');
    const formTitle = document.getElementById('formTitle');

    // ============================================================
    // RENDERIZAÇÃO UNIFICADA
    // ============================================================
    function renderBooks() {
        if (!state.books.length) {
            mainContent.innerHTML = `<div class="hero-section"><h2>Nenhum livro cadastrado</h2></div>`;
            return;
        }

        const mainBook = state.books[0];
        const otherBooks = state.books.slice(1);

        // Gera a seção hero responsiva (mobile-first, melhorada para desktop via CSS)
        const heroHTML = `
            <section class="hero-section container">
                <div class="book-cover" style="${mainBook.image ? `background-image: url('${mainBook.image}')` : 'background: linear-gradient(145deg, #1a0f0a, #3d2317);'}">
                    ${!mainBook.image ? `<div class="book-cover-content"><h2>${mainBook.title}</h2><p>${mainBook.author}</p></div>` : ''}
                </div>
                <div class="hero-info">
                    <h2>${mainBook.title}</h2>
                    ${mainBook.subtitle ? `<p class="subtitle">${mainBook.subtitle}</p>` : ''}
                    <p class="author">Por ${mainBook.author}</p>
                    <p class="price">${mainBook.price} <span>${mainBook.oldPrice}</span></p>
                    <div class="hero-buttons">
                        <a href="#" class="btn">📖 Comprar Agora</a>
                        <a href="#" class="btn btn-secondary">📄 Ler Amostra</a>
                    </div>
                </div>
                <div class="scroll-indicator">↓</div>
            </section>
        `;

        // Sinopse
        const synopsisHTML = `
            <section class="synopsis-bar">
                <div class="container">
                    <div class="synopsis-icon">📖</div>
                    <div class="synopsis-text">
                        <h3>Sinopse</h3>
                        <p>${mainBook.synopsis.replace(/\n/g, '<br>')}</p>
                    </div>
                </div>
            </section>
        `;

        // Outros livros
        let otherBooksHTML = '';
        if (otherBooks.length) {
            otherBooksHTML = `
                <section class="other-books">
                    <div class="container">
                        <h2>📕 Outros Títulos que Você Pode Gostar</h2>
                        <div class="books-grid">
                            ${otherBooks.map(book => `
                                <div class="book-card" data-id="${book.id}">
                                    <div class="mini-cover" style="${book.image ? `background-image: url('${book.image}')` : ''}">
                                        ${!book.image ? `<span>${book.title}</span>` : ''}
                                    </div>
                                    <h3>${book.title}</h3>
                                    <p class="card-author">${book.author}</p>
                                    <p class="card-price">${book.price} <span>${book.oldPrice}</span></p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>
            `;
        }

        mainContent.innerHTML = heroHTML + synopsisHTML + otherBooksHTML;

        // Event listeners nos cards de livros
        document.querySelectorAll('.book-card').forEach(card => {
            card.addEventListener('click', () => openBookDetail(card.dataset.id));
        });
    }

    // ============================================================
    // LISTENER FIRESTORE EM TEMPO REAL
    // ============================================================
    booksCollection.orderBy('createdAt', 'asc').onSnapshot(snapshot => {
        const books = [];
        snapshot.forEach(doc => books.push({ id: doc.id, ...doc.data() }));
        state.books = books;
        renderBooks();
        if (adminPanel.classList.contains('active')) renderAdminList();
    });

    // ============================================================
    // FUNÇÕES AUXILIARES DE ADMIN
    // ============================================================
    function renderAdminList() {
        adminBookList.innerHTML = state.books.map((book, i) => `
            <div class="book-item">
                <img src="${book.image || 'https://via.placeholder.com/40x60/2c1810/d4af37?text=Capa'}">
                <div class="info">
                    <strong>${book.title}</strong> ${i === 0 ? '<span style="color:#d4af37">(Principal)</span>' : ''}<br>
                    <span>${book.author}</span>
                </div>
                <div class="actions">
                    <button class="btn-admin btn-edit" data-id="${book.id}">Editar</button>
                    <button class="btn-admin btn-delete" data-id="${book.id}">Excluir</button>
                </div>
            </div>
        `).join('');
    }

    async function addBook(book) {
        await booksCollection.add({...book, createdAt: firebase.firestore.FieldValue.serverTimestamp()});
    }
    async function updateBook(id, book) {
        await booksCollection.doc(id).update(book);
    }
    async function deleteBook(id) {
        await booksCollection.doc(id).delete();
    }

    // ============================================================
    // PAINEL DE DETALHES
    // ============================================================
    function openBookDetail(id) {
        const book = state.books.find(b => b.id === id);
        if (!book) return;
        bookDetailContent.innerHTML = `
            <div class="panel-cover" style="${book.image ? `background-image: url('${book.image}')` : ''}"></div>
            <h2>${book.title}</h2>
            <p>${book.author}</p>
            <p class="panel-price">${book.price} <span>${book.oldPrice}</span></p>
            <p>${book.synopsis}</p>
        `;
        bookDetailOverlay.style.display = 'block';
        bookDetailPanel.classList.add('active');
    }
    bookDetailClose.onclick = () => {
        bookDetailOverlay.style.display = 'none';
        bookDetailPanel.classList.remove('active');
    };

    // ============================================================
    // ABERTURA DO PAINEL ADMIN (5 CLIQUES)
    // ============================================================
    let clickCount = 0;
    mainTitle.onclick = () => {
        clickCount++;
        setTimeout(() => clickCount = 0, 1500);
        if (clickCount === 5) {
            clickCount = 0;
            adminPanelOverlay.style.display = 'block';
            adminPanel.classList.add('active');
            lpTitleInput.value = state.lpTitle;
            renderAdminList();
        }
    };
    document.getElementById('adminPanelClose').onclick = () => {
        adminPanelOverlay.style.display = 'none';
        adminPanel.classList.remove('active');
    };

    // Salvar título LP (em config doc)
    saveLpTitleBtn.onclick = async () => {
        state.lpTitle = lpTitleInput.value;
        mainTitle.textContent = state.lpTitle;
        footerTitle.textContent = state.lpTitle.replace('☕ ', '');
        await db.collection('config').doc('landing').set({ title: state.lpTitle }, { merge: true });
    };

    // Formulário Admin
    addNewBookBtn.onclick = () => {
        adminForm.style.display = 'grid';
        formTitle.textContent = 'Novo Livro';
        adminForm.reset();
    };
    cancelFormBtn.onclick = () => { adminForm.style.display = 'none'; };
    adminForm.onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('bookId').value;
        const book = {
            title: document.getElementById('bookTitle').value,
            subtitle: document.getElementById('bookSubtitle').value,
            author: document.getElementById('bookAuthor').value,
            price: document.getElementById('bookPrice').value,
            oldPrice: document.getElementById('bookOldPrice').value,
            image: document.getElementById('bookImage').value,
            synopsis: document.getElementById('bookSynopsis').value
        };
        if (id) await updateBook(id, book);
        else await addBook(book);
        adminForm.style.display = 'none';
    };

    // Event delegation para editar/excluir
    adminBookList.onclick = (e) => {
        const id = e.target.dataset.id;
        if (e.target.classList.contains('btn-edit')) {
            const book = state.books.find(b => b.id === id);
            if (book) {
                document.getElementById('bookId').value = book.id;
                document.getElementById('bookTitle').value = book.title;
                document.getElementById('bookSubtitle').value = book.subtitle || '';
                document.getElementById('bookAuthor').value = book.author;
                document.getElementById('bookPrice').value = book.price;
                document.getElementById('bookOldPrice').value = book.oldPrice;
                document.getElementById('bookImage').value = book.image || '';
                document.getElementById('bookSynopsis').value = book.synopsis;
                formTitle.textContent = 'Editando Livro';
                adminForm.style.display = 'grid';
            }
        } else if (e.target.classList.contains('btn-delete')) {
            if (confirm('Excluir livro?')) deleteBook(id);
        }
    };
    </script>
</body>
</html>
