<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livro: O Código da Mente - Jessica Code</title>
    <style>
        /* Reset e estilos base */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0f0a 0%, #2c1810 30%, #3d2317 60%, #4a2c1e 100%);
            color: #f5e6d3;
            min-height: 100vh;
            line-height: 1.6;
            position: relative;
        }
        body.no-scroll { overflow: hidden; }

        /* Fios dourados decorativos */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 50%, rgba(212, 175, 55, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 20%, rgba(212, 175, 55, 0.04) 0%, transparent 40%);
            pointer-events: none; z-index: -1;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }

        /* Header */
        header {
            padding: 20px 0; text-align: center; border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            background: rgba(26, 15, 10, 0.8); backdrop-filter: blur(10px); position: relative; z-index: 10;
        }
        header h1 {
            font-size: 1.5rem; font-weight: 300; letter-spacing: 3px; text-transform: uppercase;
            color: #d4af37; text-shadow: 0 0 20px rgba(212, 175, 55, 0.3); cursor: pointer;
        }

        /* Seção principal do livro */
        .hero { display: flex; align-items: center; justify-content: center; gap: 60px; padding: 80px 0; flex-wrap: wrap; }
        .book-cover {
            flex: 0 0 300px; height: 450px; background: linear-gradient(145deg, #1a0f0a, #3d2317);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; text-align: center; padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(212, 175, 55, 0.1), inset 0 0 30px rgba(212, 175, 55, 0.05);
            position: relative; overflow: hidden; border: 1px solid rgba(212, 175, 55, 0.2);
            background-size: cover; background-position: center;
        }
        .book-cover-content { position: relative; z-index: 1; color: #f5e6d3; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); background: rgba(0,0,0,0.4); padding: 15px; border-radius: 8px; backdrop-filter: blur(4px); }
        .book-cover h2 { font-size: 2rem; margin-bottom: 10px; text-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
        .book-cover p { font-size: 0.9rem; opacity: 0.9; }
        .book-info { flex: 1; min-width: 300px; }
        .book-info h2 { font-size: 2.5rem; margin-bottom: 15px; color: #d4af37; text-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
        .book-info .author { font-size: 1.1rem; color: #c4a882; margin-bottom: 20px; }
        .book-info .price { font-size: 2rem; font-weight: 700; color: #d4af37; margin-bottom: 25px; text-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
        .book-info .price span { font-size: 1rem; color: #8b7355; text-decoration: line-through; margin-left: 10px; font-weight: 400; }
        .btn { display: inline-block; padding: 16px 40px; background: linear-gradient(90deg, #d4af37, #f0d68a); color: #1a0f0a; text-decoration: none; border-radius: 50px; font-weight: 600; font-size: 1.1rem; transition: all 0.3s ease; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4), 0 0 30px rgba(212, 175, 55, 0.1); }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6), 0 0 40px rgba(212, 175, 55, 0.2); }
        .btn-secondary { background: transparent; border: 2px solid #d4af37; color: #d4af37; margin-left: 15px; box-shadow: none; }
        .btn-secondary:hover { background: rgba(212, 175, 55, 0.1); box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }

        /* Faixa de Sinopse */
        .synopsis-bar { background: rgba(26, 15, 10, 0.9); padding: 40px 0; border-top: 2px solid rgba(212, 175, 55, 0.3); border-bottom: 2px solid rgba(212, 175, 55, 0.3); margin: 20px 0; position: relative; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), inset 0 0 30px rgba(212, 175, 55, 0.05); }
        .synopsis-bar .container { display: flex; align-items: center; gap: 40px; flex-wrap: wrap; }
        .synopsis-bar .synopsis-icon { font-size: 3rem; color: #d4af37; text-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
        .synopsis-bar .synopsis-text { flex: 1; min-width: 250px; }
        .synopsis-bar .synopsis-text h3 { font-size: 1.3rem; color: #d4af37; margin-bottom: 10px; text-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
        .synopsis-bar .synopsis-text p { font-size: 1.05rem; color: #e8d5c4; line-height: 1.8; }

        /* Seção de outros livros */
        .other-books { padding: 80px 0; }
        .other-books h2 { text-align: center; font-size: 2rem; margin-bottom: 50px; color: #d4af37; text-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
        .books-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; }
        .book-card { background: rgba(26, 15, 10, 0.8); border-radius: 12px; padding: 30px; text-align: center; transition: all 0.3s ease; border: 1px solid rgba(212, 175, 55, 0.2); backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(212, 175, 55, 0.03); }
        .book-card:hover { transform: translateY(-5px); background: rgba(26, 15, 10, 0.9); border-color: #d4af37; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(212, 175, 55, 0.1); }
        .book-card .mini-cover {
            width: 100%; height: 170px; margin: 0 auto 20px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; color: #f5e6d3; font-weight: 600; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(212, 175, 55, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2); background-size: cover; background-position: center;
        }
        .book-card .mini-cover-content { background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; backdrop-filter: blur(3px); }
        .book-card h3 { font-size: 1.2rem; margin-bottom: 8px; color: #f5e6d3; }
        .book-card .card-author { font-size: 0.9rem; color: #c4a882; margin-bottom: 10px; }
        .book-card .card-price { font-size: 1.3rem; font-weight: 700; color: #d4af37; margin-bottom: 15px; text-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        .book-card .card-price span { font-size: 0.9rem; color: #8b7355; text-decoration: line-through; margin-left: 5px; }

        /* Footer */
        footer { text-align: center; padding: 40px 0; border-top: 1px solid rgba(212, 175, 55, 0.2); color: #c4a882; font-size: 0.9rem; background: rgba(26, 15, 10, 0.8); backdrop-filter: blur(10px); }
        footer a { color: #d4af37; text-decoration: none; transition: all 0.3s ease; }
        footer a:hover { text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }

        /* PAINEL DE ADMINISTRAÇÃO */
        .admin-panel-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: 1000; opacity: 0; transition: opacity 0.3s ease;
        }
        .admin-panel-overlay.active { display: block; opacity: 1; }
        .admin-panel {
            position: fixed; top: -85vh; left: 0; width: 100%; height: 85vh;
            background: linear-gradient(135deg, #1a0f0a, #2c1810);
            border-radius: 0 0 30px 30px; z-index: 1001;
            transition: top 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 60px rgba(212, 175, 55, 0.1);
            overflow-y: auto; border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }
        .admin-panel.active { top: 0; }
        .admin-panel .panel-content { padding: 40px; max-width: 900px; margin: 0 auto; }
        .admin-panel .panel-close {
            position: absolute; top: 20px; right: 20px; width: 40px; height: 40px;
            background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%; font-size: 1.5rem; cursor: pointer; color: #d4af37;
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center;
        }
        .admin-panel .panel-close:hover { background: rgba(212, 175, 55, 0.2); transform: rotate(90deg); box-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
        .admin-panel h2 { color: #d4af37; margin-bottom: 20px; border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding-bottom: 10px; }
        
        /* Lista de Livros no Admin */
        .admin-book-list .book-item {
            display: flex; align-items: center; gap: 15px; padding: 15px;
            background: rgba(255,255,255,0.03); border-radius: 8px; margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .admin-book-list .book-item img { width: 40px; height: 60px; border-radius: 4px; object-fit: cover; }
        .admin-book-list .book-item .info { flex: 1; }
        .admin-book-list .book-item .info strong { color: #f5e6d3; }
        .admin-book-list .book-item .info span { color: #c4a882; font-size: 0.9em; }
        .admin-book-list .book-item .actions { display: flex; gap: 10px; }
        .btn-admin { padding: 8px 12px; font-size: 0.9rem; border-radius: 5px; cursor: pointer; border: 1px solid; transition: all 0.2s; }
        .btn-edit { background-color: #d4af37; color: #1a0f0a; border-color: #d4af37; }
        .btn-edit:hover { background-color: #f0d68a; }
        .btn-delete { background-color: transparent; color: #ff6b6b; border-color: #ff6b6b; }
        .btn-delete:hover { background-color: rgba(255, 107, 107, 0.1); }

        /* Formulário do Admin */
        .admin-form {
            background: rgba(0,0,0,0.2); padding: 25px; border-radius: 12px; margin-top: 30px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        }
        .admin-form .form-group { display: flex; flex-direction: column; }
        .admin-form .full-width { grid-column: 1 / -1; }
        .admin-form label { margin-bottom: 5px; font-size: 0.9rem; color: #c4a882; }
        .admin-form input, .admin-form textarea {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 5px; padding: 12px; color: #f5e6d3; font-size: 1rem;
        }
        .admin-form textarea { min-height: 120px; resize: vertical; }
        .admin-form .form-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 15px; }

        /* Responsivo */
        @media (max-width: 768px) {
            .hero { flex-direction: column; text-align: center; padding: 40px 0; }
            .book-info h2 { font-size: 2rem; }
            .btn-secondary { margin-left: 0; margin-top: 15px; }
            .book-cover { flex: 0 0 auto; width: 250px; height: 375px; }
            .synopsis-bar .container { flex-direction: column; text-align: center; }
            .admin-form { grid-template-columns: 1fr; }
            .admin-form .full-width { grid-column: auto; }
            .admin-book-list .book-item { flex-direction: column; align-items: flex-start; }
        }
        @media (max-width: 480px) {
            header h1 { font-size: 1.2rem; }
            .book-info h2 { font-size: 1.8rem; }
            .book-info .price { font-size: 1.6rem; }
            .btn { padding: 12px 30px; font-size: 1rem; }
            .other-books h2 { font-size: 1.6rem; }
            .admin-panel .panel-content { padding: 20px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1 id="mainTitle">☕ Jessica Code Editora</h1>
        </div>
    </header>

    <main id="mainContent">
        <!-- O conteúdo aqui será gerado dinamicamente pelo JavaScript -->
    </main>

    <!-- Painel de Administração -->
    <div class="admin-panel-overlay" id="adminPanelOverlay"></div>
    <div class="admin-panel" id="adminPanel">
        <button class="panel-close" id="adminPanelClose">✕</button>
        <div class="panel-content">
            <h2>Gerenciador de Livros</h2>
            <div class="admin-book-list" id="adminBookList">
                <!-- Lista de livros será preenchida aqui -->
            </div>
            
            <button class="btn" id="addNewBookBtn" style="margin-top: 20px; width: 100%;">+ Adicionar Novo Livro</button>

            <form class="admin-form" id="adminForm" style="display: none;">
                <input type="hidden" id="bookId">
                <h3 id="formTitle" class="full-width" style="color: #f0d68a; margin-bottom: 10px;"></h3>
                
                <div class="form-group">
                    <label for="bookTitle">Título</label>
                    <input type="text" id="bookTitle" required>
                </div>
                <div class="form-group">
                    <label for="bookAuthor">Autor</label>
                    <input type="text" id="bookAuthor" required>
                </div>
                <div class="form-group">
                    <label for="bookPrice">Preço Promocional (ex: R$ 49,90)</label>
                    <input type="text" id="bookPrice" required>
                </div>
                <div class="form-group">
                    <label for="bookOldPrice">Preço Original (ex: R$ 89,90)</label>
                    <input type="text" id="bookOldPrice" required>
                </div>
                <div class="form-group full-width">
                    <label for="bookImage">URL da Imagem da Capa</label>
                    <input type="url" id="bookImage" placeholder="https://exemplo.com/capa.jpg">
                </div>
                <div class="form-group full-width">
                    <label for="bookSynopsis">Sinopse (pode colar texto formatado)</label>
                    <textarea id="bookSynopsis" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelFormBtn">Cancelar</button>
                    <button type="submit" class="btn">Salvar Livro</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2024 Jessica Code Editora - Todos os direitos reservados</p>
            <p>Feito com ☕ para desenvolvedores | <a href="#">Termos de Uso</a> | <a href="#">Privacidade</a></p>
        </div>
    </footer>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- ESTADO E DADOS INICIAIS ---
        let books = [];
        const initialBooks = [
            {
                id: 1,
                title: 'O Código da Mente',
                author: 'Jessica Code & Equipe',
                price: 'R$ 49,90',
                oldPrice: 'R$ 89,90',
                synopsis: 'Uma jornada fascinante pelo universo da programação, onde a lógica encontra a criatividade. Aprenda a pensar como um desenvolvedor sênior e transforme suas ideias em código funcional. Inclui exemplos práticos, desafios e acesso a comunidade exclusiva. Este livro é o guia definitivo para quem quer dominar a arte da programação moderna.',
                image: '' // Sem imagem para usar o design padrão
            },
            {
                id: 2,
                title: 'Algoritmos do Amor',
                author: 'Maria Silva',
                price: 'R$ 39,90',
                oldPrice: 'R$ 69,90',
                synopsis: 'Descubra como os algoritmos podem ajudar a encontrar o amor verdadeiro. Uma abordagem única que une programação e relacionamentos.',
                image: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400'
            },
            {
                id: 3,
                title: 'Estruturas de Dados',
                author: 'Carlos Oliveira',
                price: 'R$ 59,90',
                oldPrice: 'R$ 89,90',
                synopsis: 'Domine as estruturas de dados mais importantes do mercado, com exemplos práticos em Python e JavaScript.',
                image: 'https://images.unsplash.com/photo-1589998059171-988d887df646?w=400'
            },
            {
                id: 4,
                title: 'React Profundo',
                author: 'Ana Costa',
                price: 'R$ 69,90',
                oldPrice: 'R$ 99,90',
                synopsis: 'Vá além do básico do React e aprenda padrões avançados, otimização de performance e arquitetura de componentes.',
                image: 'https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=400'
            },
            {
                id: 5,
                title: 'Python para Todos',
                author: 'Lucas Mendes',
                price: 'R$ 44,90',
                oldPrice: 'R$ 74,90',
                synopsis: 'Aprenda Python do zero de forma prática e divertida. Cobre desde conceitos básicos até web scraping e análise de dados.',
                image: 'https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=400'
            }
        ];

        // --- ELEMENTOS DO DOM ---
        const mainContent = document.getElementById('mainContent');
        const mainTitle = document.getElementById('mainTitle');
        const adminPanelOverlay = document.getElementById('adminPanelOverlay');
        const adminPanel = document.getElementById('adminPanel');
        const adminPanelClose = document.getElementById('adminPanelClose');
        const adminBookList = document.getElementById('adminBookList');
        const addNewBookBtn = document.getElementById('addNewBookBtn');
        const adminForm = document.getElementById('adminForm');
        const cancelFormBtn = document.getElementById('cancelFormBtn');
        const formTitle = document.getElementById('formTitle');

        // --- FUNÇÕES DE RENDERIZAÇÃO ---
        function renderLandingPage() {
            if (books.length === 0) {
                mainContent.innerHTML = `<div class="container" style="padding: 80px 20px; text-align: center;"><h2>Nenhum livro cadastrado.</h2><p>Clique 5 vezes no título da página para abrir o painel e adicionar livros.</p></div>`;
                return;
            }

            const mainBook = books[0];
            const otherBooks = books.slice(1);

            const heroHTML = `
                <section class="hero container">
                    <div class="book-cover" style="${mainBook.image ? `background-image: url('${mainBook.image}')` : ''}">
                        <div class="book-cover-content">
                            <h2>${mainBook.title.replace(' ', '<br>')}</h2>
                            <p>${mainBook.author}</p>
                        </div>
                    </div>
                    <div class="book-info">
                        <h2>${mainBook.title}</h2>
                        <p class="author">Por ${mainBook.author}</p>
                        <p class="price">
                            ${mainBook.price} <span>${mainBook.oldPrice}</span>
                        </p>
                        <a href="#" class="btn">📖 Comprar Agora</a>
                        <a href="#" class="btn btn-secondary">📄 Ler Amostra</a>
                    </div>
                </section>
            `;

            const synopsisHTML = `
                <section class="synopsis-bar">
                    <div class="container">
                        <div class="synopsis-icon">📖</div>
                        <div class="synopsis-text">
                            <h3>Sinopse</h3>
                            <p>${mainBook.synopsis.replace(/\n/g, '<br>')}</p>
                        </div>
                    </div>
                </section>
            `;

            const otherBooksHTML = otherBooks.length > 0 ? `
                <section class="other-books">
                    <div class="container">
                        <h2>📕 Outros Títulos que Você Pode Gostar</h2>
                        <div class="books-grid">
                            ${otherBooks.map(book => `
                                <div class="book-card">
                                    <div class="mini-cover" style="${book.image ? `background-image: url('${book.image}')` : 'background: linear-gradient(135deg, #4a2c1e, #2c1810);'}">
                                        <div class="mini-cover-content">
                                            <span>${book.title}</span>
                                        </div>
                                    </div>
                                    <h3>${book.title}</h3>
                                    <p class="card-author">${book.author}</p>
                                    <p class="card-price">${book.price} <span>${book.oldPrice}</span></p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </section>
            ` : '';

            mainContent.innerHTML = heroHTML + synopsisHTML + otherBooksHTML;
        }

        function renderAdminPanel() {
            adminBookList.innerHTML = books.map((book, index) => `
                <div class="book-item">
                    <img src="${book.image || 'https://via.placeholder.com/40x60/2c1810/d4af37?text=Capa'}" alt="Capa de ${book.title}">
                    <div class="info">
                        <strong>${book.title}</strong> ${index === 0 ? '<span style="color: #d4af37;">(Principal)</span>' : ''}<br>
                        <span>${book.author}</span>
                    </div>
                    <div class="actions">
                        <button class="btn-admin btn-edit" data-id="${book.id}">Editar</button>
                        <button class="btn-admin btn-delete" data-id="${book.id}">Excluir</button>
                    </div>
                </div>
            `).join('');
        }

        // --- FUNÇÕES DE DADOS (LocalStorage) ---
        function saveBooks() {
            localStorage.setItem('jessicaCodeBooks', JSON.stringify(books));
        }

        function loadBooks() {
            const storedBooks = localStorage.getItem('jessicaCodeBooks');
            if (storedBooks) {
                books = JSON.parse(storedBooks);
            } else {
                books = initialBooks;
                saveBooks();
            }
        }

        // --- LÓGICA DO PAINEL ADMIN ---
        let clickCount = 0;
        let clickTimer = null;

        mainTitle.addEventListener('click', () => {
            clickCount++;
            if (clickTimer) clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clickCount = 0; }, 1500); // Reseta após 1.5s
            if (clickCount === 5) {
                clickCount = 0;
                openAdminPanel();
            }
        });

        function openAdminPanel() {
            renderAdminPanel();
            adminPanelOverlay.classList.add('active');
            adminPanel.classList.add('active');
            document.body.classList.add('no-scroll');
        }

        function closeAdminPanel() {
            adminPanelOverlay.classList.remove('active');
            adminPanel.classList.remove('active');
            document.body.classList.remove('no-scroll');
            hideForm();
        }

        adminPanelClose.addEventListener('click', closeAdminPanel);
        adminPanelOverlay.addEventListener('click', closeAdminPanel);

        // --- LÓGICA DO FORMULÁRIO ---
        function showForm(type = 'new', book = null) {
            adminForm.style.display = 'grid';
            addNewBookBtn.style.display = 'none';
            adminForm.reset();
            document.getElementById('bookId').value = '';

            if (type === 'edit' && book) {
                formTitle.textContent = 'Editando Livro';
                document.getElementById('bookId').value = book.id;
                document.getElementById('bookTitle').value = book.title;
                document.getElementById('bookAuthor').value = book.author;
                document.getElementById('bookPrice').value = book.price;
                document.getElementById('bookOldPrice').value = book.oldPrice;
                document.getElementById('bookImage').value = book.image;
                document.getElementById('bookSynopsis').value = book.synopsis;
            } else {
                formTitle.textContent = 'Adicionar Novo Livro';
            }
        }

        function hideForm() {
            adminForm.style.display = 'none';
            addNewBookBtn.style.display = 'block';
        }

        addNewBookBtn.addEventListener('click', () => showForm('new'));
        cancelFormBtn.addEventListener('click', hideForm);

        adminForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('bookId').value;
            const bookData = {
                title: document.getElementById('bookTitle').value,
                author: document.getElementById('bookAuthor').value,
                price: document.getElementById('bookPrice').value,
                oldPrice: document.getElementById('bookOldPrice').value,
                image: document.getElementById('bookImage').value,
                synopsis: document.getElementById('bookSynopsis').value,
            };

            if (id) { // Editando
                const index = books.findIndex(b => b.id == id);
                if (index > -1) {
                    books[index] = { ...books[index], ...bookData };
                }
            } else { // Criando
                bookData.id = Date.now(); // ID único
                books.push(bookData);
            }

            saveBooks();
            renderLandingPage();
            renderAdminPanel();
            hideForm();
        });

        // --- AÇÕES DE EDITAR/EXCLUIR (Event Delegation) ---
        adminBookList.addEventListener('click', (e) => {
            const target = e.target;
            const bookId = target.dataset.id;

            if (target.classList.contains('btn-edit')) {
                const bookToEdit = books.find(b => b.id == bookId);
                if (bookToEdit) showForm('edit', bookToEdit);
            }

            if (target.classList.contains('btn-delete')) {
                if (confirm(`Tem certeza que deseja excluir este livro?`)) {
                    books = books.filter(b => b.id != bookId);
                    saveBooks();
                    renderLandingPage();
                    renderAdminPanel();
                }
            }
        });

        // --- INICIALIZAÇÃO ---
        function init() {
            loadBooks();
            renderLandingPage();
        }

        init();
    });
    </script>
</body>
</html>
